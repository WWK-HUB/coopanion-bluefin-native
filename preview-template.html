<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓝鳍 · 原画互动预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f8;color:#203354;font-family:'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:27px;margin:0 0 8px}.sub{color:#647895;font-size:14px;line-height:1.8}header{margin-bottom:20px}.layout{display:grid;grid-template-columns:290px 1fr;gap:20px}aside{padding:20px;background:white;border-radius:18px;max-height:760px;overflow:auto}h2{font-size:15px;margin:14px 0 10px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:1px solid #cfdced;border-radius:9px;background:#f7faff;padding:9px 6px;color:#24436b;cursor:pointer}button:hover,button.active{background:#dbeaff;border-color:#6b9fe0}#stage{position:relative;width:100%;height:570px;overflow:hidden;border-radius:18px;background:linear-gradient(#dbe8fb,#f8fbff 75%);touch-action:none;user-select:none}#stage:after{content:'';position:absolute;left:0;right:0;bottom:40px;border-top:1px solid #b7cce7;pointer-events:none}#hint{position:absolute;top:22px;left:25px;font-size:13px;color:#6681a4;pointer-events:none}#status{font-size:14px;margin:14px 2px;min-height:24px}#events{padding:14px;background:#ffffffb0;border-radius:12px;font:12px/1.9 Consolas,'Microsoft YaHei',monospace;color:#54708e;min-height:84px}.tools{display:flex;gap:8px;margin-top:16px}.notes{font-size:12px;line-height:1.9;color:#69809d;margin-top:18px}canvas{image-rendering:auto} @media(max-width:850px){.layout{grid-template-columns:1fr}aside{max-height:300px}#stage{height:480px}}
</style><main><header><h1>蓝鳍 · 原画互动版</h1><div class="sub">64 张透明动作帧 · 19 种原生表情 · 18 种原生动作 + 3 种额外互动<br>本页离线运行，使用软件自带的互动与物理引擎。</div></header><div class="layout"><aside><h2>表情</h2><div id="expressions" class="buttons"></div><h2>动作</h2><div id="motions" class="buttons"></div><div class="notes">在角色身上轻点：戳一戳。<br>来回移动鼠标：摸头。<br>按住拖动：提起，角色挣动。<br>快速移动后松手：抛出、落地摔晕。<br>睡觉时轻点：戳醒。<br>「头晕」可直接预览恢复过程。</div></aside><section><div id="stage"><div id="hint">试着摸摸头、把他提起来，或从左侧选择动作</div><div id="root"></div></div><div class="tools"><button id="reset">恢复站立</button><button id="demo">连续演示</button><button id="pause">暂停</button><button id="size">切换大小</button></div><div id="status">正在载入原画…</div><div id="events"></div></section></div></main>
<script type="module">
const payload=__PAYLOAD__;
const [kit,mod]=await Promise.all([import(payload.kit),import(payload.figure)]);
const stage=document.querySelector('#stage'),root=document.querySelector('#root');root.style.cssText='position:absolute;inset:0';
const events=[];let body,paused=false,scale=1.05,manual=false,demoTimer;
const bounds=()=>({W:stage.clientWidth,H:stage.clientHeight,floorY:stage.clientHeight-40,S:scale});
const imgs=new Map();
const loadImage=u=>{if(!imgs.has(u))imgs.set(u,new Promise((ok,bad)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=bad;i.src=u}));return imgs.get(u)};
async function reset(){body?.dispose();events.length=0;body=await mod.createBluefin(new URL('file:///bluefin-native/'),{kit,host:{root,bounds,emit:(kind,detail)=>{events.push({kind,...detail});if(events.length>120)events.shift()},sound(){},start:{x:stage.clientWidth/2,facing:1}},loadImage,asset:p=>payload.images[p.split('/').pop()]});body.set({roam:'off'});body.step(1/60);window.qa.body=body;return body}
window.qa={reset,events,mod,kit,loadImage,payload,manual:v=>manual=v,advance:(n=1)=>{for(let i=0;i<n;i++)body.step(1/60)},snapshot:()=>({layout:body.layout(),pose:root.querySelector('canvas')?.dataset.pose,events:[...events]})};
for(const v of payload.vocab){const b=document.createElement('button');b.textContent=v.names.zh[0];b.dataset.word=v.id;b.onclick=()=>{clearInterval(demoTimer);document.querySelectorAll('button.active').forEach(x=>x.classList.remove('active'));b.classList.add('active');body.do(v.id)};document.querySelector(v.kind==='expression'?'#expressions':'#motions').append(b)}
await reset();
let prev=performance.now();function frame(t){if(!paused&&!manual)body.step(Math.min(.04,(t-prev)/1000));prev=t;const c=root.querySelector('canvas');document.querySelector('#status').textContent=`当前状态：${body.layout().mode}　原画帧：${c?.dataset.pose||''}`;document.querySelector('#events').textContent=events.slice(-3).map(e=>JSON.stringify(e)).join('\n');requestAnimationFrame(frame)}requestAnimationFrame(frame);
const point=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:e.timeStamp}};
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);body.pointer('down',point(e))});stage.addEventListener('pointermove',e=>body.pointer('move',point(e)));stage.addEventListener('pointerup',e=>body.pointer('up',point(e)));stage.addEventListener('pointercancel',e=>body.pointer('cancel',point(e)));stage.addEventListener('pointerleave',e=>body.pointer('leave',point(e)));
document.querySelector('#reset').onclick=()=>{clearInterval(demoTimer);reset()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};document.querySelector('#size').onclick=()=>{scale=scale===1.05?.7:1.05;body.resize()};document.querySelector('#demo').onclick=async()=>{await reset();let i=0;const seq=['wave','walk','run','jump','nod','shake','bow','dance','sit','sleep','stand','dizzy','love','hug'];body.do(seq[i++]);clearInterval(demoTimer);demoTimer=setInterval(()=>{body.do(seq[i++%seq.length])},3800)};
addEventListener('resize',()=>body.resize());window.qa.ready=true;
</script></html>
